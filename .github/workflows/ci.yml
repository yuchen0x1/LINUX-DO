name: CI

# PR / push 的质量门禁：格式、静态分析、单元测试、release 构建 + 16KB 对齐校验。
# 只产出 artifact，不做任何发布动作。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  analyze-and-test:
    name: 静态分析与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 仓库上传边界检查
        run: python3 scripts/check_repository_hygiene.py

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态分析
        # 现存历史问题以 info 为主，先只对 warning/error 失败；
        # 清理完成后改为 --fatal-infos。
        run: flutter analyze --no-pub --no-fatal-infos

      - name: 单元测试
        run: flutter test --no-pub --reporter compact

  build-android:
    name: 构建三 ABI 并校验 16KB 对齐
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 构建 release APK
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols

      - name: 安装 NDK（用于 llvm-readelf）
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28

      - name: 校验 native 库 16KB 页对齐
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "=== $apk"
            bash scripts/check_16k_alignment.sh "$apk"
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 7

      # 公开仓库仅上传编译验证用 APK；发布包的符号由发布者单独保留。
      - name: 上传符号表（仅私有仓库）
        if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: obfuscation-symbols
          path: build/symbols/
          retention-days: 30
