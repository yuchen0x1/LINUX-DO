name: linux_do
description: A Linux Discourse client.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.1+13
license: MIT
repository: https://github.com/R-lz/LINUX-DO

environment:
  # 锁定依赖要求 Dart 3.13+；CI 与本地发布工具链固定为 Flutter 3.47.1。
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  lazy_load_indexed_stack: ^1.2.1
  # 321 处 CupertinoIcons 用到该字体资源，不能移除
  cupertino_icons: ^1.0.2
  retrofit: ^4.0.3
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  logger: ^2.5.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2
  # User API Key 与 RSA 私钥必须放系统密钥库，不能明文落盘
  flutter_secure_storage: ^9.2.4
  fluttertoast: ^8.2.4
  permission_handler: 12.0.1
  device_info_plus: ^9.1.1
  package_info_plus: ^8.3.0
  flutter_slidable: ^3.0.1
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0
  # 实际使用下方固定在仓库内的兼容补丁，同时满足 table 扩展的包来源约束。
  flutter_html: 3.0.0
  # flutter_html_table 自身依赖 flutter_layout_grid，无需在此直接声明
  flutter_html_table: ^3.0.0-beta.2
  path_provider: ^2.1.5
  mime: ^2.1.0
  html: 0.15.7
  flutter_inappwebview: ^6.1.5
  slide_switcher: ^1.1.2
  dropdown_search: ^6.0.2
  scrollable_positioned_list: ^0.3.8
  photo_view: ^0.15.0
  image_picker: ^1.0.7
  crypto: ^3.0.3
  calendar_date_picker2: ^1.1.8
  file_picker: ^8.3.3
  url_launcher: ^6.3.1
  flutter_markdown: ^0.6.18+2
  font_awesome_flutter: ^11.0.0
  flutter_custom_tabs: ^2.1.0
  mobile_scanner: 7.5.0
  video_player: ^2.9.3
  flutter_chat_ui: ^1.6.15
  flutter_chat_types: ^3.6.2
  uuid: ^4.3.3
  expandable_page_view: ^1.0.17
  flutter_svg: ^2.0.17
  get_storage: ^2.1.1
  share_plus: ^10.1.4
  flutter_keyboard_visibility: ^6.0.0
  qr_flutter: ^4.1.0
  salomon_bottom_bar: ^3.3.2
  emoji_picker_flutter:
    git:
      url: https://github.com/R-lz/emoji_picker_flutter.git
      ref: eef3d77b37701d45628f66702557a037d433eab0
  image_gallery_saver: 2.0.3
  cached_network_image: ^3.3.1
  pointycastle: 3.9.1
  flutter_local_notifications: 19.5.0
  cronet_http: 1.10.1
  http: ^1.6.0
  app_links: ^7.2.2

dependency_overrides:
  flutter_html:
    path: third_party/flutter_html
  image_gallery_saver:
    path: third_party/image_gallery_saver

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  retrofit_generator: ^8.0.6
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  # flutter_launcher_icons: ^0.14.3

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/light/
    - assets/images/dark/
    - assets/json/
    - assets/html/
    - assets/icons/
    - assets/emojis/
  fonts:
    - family: DINPro
      fonts:
        - asset: assets/fonts/digital/D-DIN-PRO-Regular.otf
        - asset: assets/fonts/digital/D-DIN-PRO-Medium.otf
        - asset: assets/fonts/digital/D-DIN-PRO-Bold.otf
        - asset: assets/fonts/digital/D-DINExp.otf
